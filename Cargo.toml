[package]
name = "dropping-thread-local"
description = "A dynamically allocated ThreadLocal that ensures destructors are run on thread exit"
version = "0.1.5"
authors = ["Techcable"]
license = "Apache-2.0 OR MIT"
edition = "2024"
repository = "https://github.com/Techcable/dropping-thread-local.rs"
keywords = ["concurrent", "destructor", "drop", "thread", "thread-local"]
categories = ["concurrency", "data-structures", "memory-management"]
# 1.85 - 2024 edition
# 1.86 - criterion@0.8
rust-version = "1.85"

[[bench]]
harness = false
name = "lookup"

[dependencies]
foldhash = "0.2"
# persistent collections
imbl = "7"
intid = { version = "0.3.0-beta.1", features = ["nonmax"] }
intid-allocator = "0.3.0-beta.1"
nonmax = "0.5"
parking_lot = "0.12"

[dev-dependencies]
# Need to support building with criterion v0.7 as v0.8 has a MSRV higher than we do
# There aren't many changes between these releases so this is pretty easy.
criterion = ">=0.7,<=0.8"
thread_local = "1"

[features]
nightly = [
    "parking_lot/nightly",
]

[lints.clippy]
# style

alloc_instead_of_core = "warn"
checked_conversions = "deny" # prefer try_from to explicit range checks
macro_use_imports = "deny" # forbid old-style #[macro_use]
std_instead_of_alloc = "warn"
std_instead_of_core = "warn"

# in an ideal world. overflowing casts would panic
# linting them (with deny) is the second best option

cast_lossless = "allow" # lossless casts are fine, lints will catch if types change
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_ptr_alignment = "deny"
cast_sign_loss = "deny"
char_lit_as_u8 = "deny"
fn_to_numeric_cast = "deny"
fn_to_numeric_cast_any = "deny"
fn_to_numeric_cast_with_truncation = "deny"
ptr_as_ptr = "allow" # pointer casts are fine as long as they don't violate another rule

# safety

missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny" # all unsafe blocks should be documented

# debugging leftovers

dbg_macro = "allow"
print_stderr = "allow"
print_stdout = "allow"

[lints.rust]
macro_use_extern_crate = "deny"
missing_docs = "deny"
rust_2024_compatibility = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"

[profile.bench]
debug = true
