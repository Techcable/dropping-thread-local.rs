# Unified workflow for all lints & tests.
#
# Based on the biasedrc CI config
# Indirectly based on the slog CI config.
# All merged into one file so we can use `allgood` workaround for Gihtub Actions.
on: [push, pull_request]
name: CI

env:
  CARGO_TERM_COLOR: always
  CLICOLOR: 1
  # has a history of occasional bugs (especially on old versions)
  #
  # the ci is free so we might as well use it ;)
  CARGO_INCREMENTAL: 0


jobs:
  test:
    # Only run on PRs if the source branch is on someone else's repo
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Even if one job fails we still want to see the other ones
      matrix:
        rust:
          # Minimum Supported Rust Version
          #
          # This is hardcoded and needs to be in sync with Cargo.toml and the README
          - 1.85

          # Intermediate Releases (between MSRV and latest stable)
          # Be careful not to add these needlessly; they hold up CI

          # The most recent version of stable rust (automatically updated)
          - stable
          - nightly
        # NOTE: Features to test must be specified manually. They are applied to all versions separately.
        features:
          - ""
        include:
          - rust: nightly
            features: "nightly"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - # NOTE: This updates based on declared rust-version, not current toolchain
        name: Pin MSRV-compatible versions
        if: ${{ contains(matrix.rust, '1.') }}  # ignored for non-pinned versions
        env:
          # on pinned versions, we want to use latest versions
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: ${{ case(contains(matrix.rust, '1.'), 'fallback', 'allow') }}
        run: |
          rm -f Cargo.lock
          cargo +stable update
      - name: Test
        # NOTE: Running --all-targets actually excludes doc tests. See rust-lang/cargo#6669
        # The `--all` flag is equivalent to `--workspace`
        run: |
          cargo nextest run --workspace --verbose --no-default-features --features "${{ matrix.features }}"
      # nextest doesn't support doctests (https://github.com/nextest-rs/nextest/issues/16)
      - name: Doctests
        run: |
          cargo test --doc --workspace --verbose --no-default-features --features "${{ matrix.features }}"

  clippy:
    # Only run on PRs if the source branch is on someone else's repo
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust:
          # in hardcoded versions, warnings will fail the build
          - 1.99.1
          # in auto-updated versions, warnings will not fail the build
          - stable
          - nightly
        features:
          - ""

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        # The `--all` flag is equivalent to `--workspace`
        run: |
          cargo clippy --workspace --all-targets --verbose --no-default-features --features "${{ matrix.features }}" -- -D warnings
        # When using hardcoded/pinned versions, warnings are forbidden.
        #
        # On automatically updated versions of rust (both stable & nightly) we allow clippy to fail.
        # This is because automatic updates can introduce new lints or change existing lints.
        continue-on-error: ${{ !contains(matrix.rust, '1.') }}

  docs:
    # Only run on PRs if the source branch is on someone else's repo
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}

    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    strategy:
      fail-fast: false
      matrix:
        rust:
          - nightly
          - stable

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: Docs
        # NOTE: Passing --document-private-items is needed to check for doc errors in private items
        # We also need to pass --all-features or else we get stale doclinks
        run: |
          cargo doc --document-private-items --no-deps --workspace --verbose --all-features

  docs-rs:
    # Only run on PRs if the source branch is on someone else's repo
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}

    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    strategy:
      fail-fast: false
      matrix:
        package:
          - dropping-thread-local

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: dtolnay/install@cargo-docs-rs
      - uses: Swatinem/rust-cache@v2
      - name: docs.rs
        run: |
          cargo docs-rs -p ${{ matrix.package }}

  cargo-rdme:
    # Only run on PRs if the source branch is on someone else's repo
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-rdme
      - uses: Swatinem/rust-cache@v2
        with:
          # cached separately
          cache-bin: false
      - name: Setup python
        id: setup-python
        uses: actions/setup-python@v6
      - name: Setup uv
        id: setup-uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Install pyinvoke
        id: install-pyinvoke
        run: |
          uv tool install invoke
      - name: Install cargo-rdme toolchain
        # cargo-rdme needs a pinned nightly toolchain for its intralink processing
        run: |
          cargo rdme install-rust-toolchain-for-intralinks
      - name: Run cargo-rdme
        # We only want to sync the readmes of a subset of packages.
        # Delegate to pyinvoke in order to keep the list of packages in one central place.
        run: |
          invoke cargo-rdme --check

  cargo-shear:
    # Only run on PRs if the source branch is on someone else's repo
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-shear
      - run: cargo shear

  cargo-deny:
    # Only run on PRs if the source branch is on someone else's repo
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: |
          cargo deny check

  typos:
    # Only run on PRs if the source branch is on someone else's repo
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run typos (pinned version)
        uses: crate-ci/typos@v1.51.1

  rustfmt:
    # Only run on PRs if the source branch is on someone else's repo
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # need nightly for unstable formatting features
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - shell: bash
        # While `--all` is normally an alias for `--workspace`, `cargo fmt` doesn't accept the latter/
        run: |
          cargo fmt --all -- --check

  tombi:
    # Only run on PRs if the source branch is on someone else's repo
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: tombi-toml/setup-tombi@v1.4.0
      - run: |
          tombi format --check

  pyfmt:
    # Only run on PRs if the source branch is on someone else's repo
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
        with:
          args: "format --check --diff"
      - uses: astral-sh/ruff-action@v3
        name: isort with ruff
        with:
          args: "check --select=I --diff"

  # Workaround for Github status checks to require that all tests pass
  # Discussion: https://github.com/orgs/community/discussions/26733
  # App: https://github.com/marketplace/actions/alls-green
  allgood:
    if: always()
    needs:
      - test
      - clippy
      - docs
      - docs-rs
      - cargo-rdme
      - cargo-shear
      - cargo-deny
      - typos
      - rustfmt
      - tombi
      - pyfmt
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          # allowed-failures: docs, linters
          # allowed-skips: non-voting-flaky-job
          jobs: ${{ toJSON(needs) }}
